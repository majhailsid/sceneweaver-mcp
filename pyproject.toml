[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneweaver-mcp"
version = "0.1.2"
description = "Local MCP tools for planning, previewing and rendering narrated short videos"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "SceneWeaver contributors"}]
keywords = ["mcp", "video", "storyboard", "local", "tts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2,<3",
  "pillow>=12.3",
  "numpy>=2,<3",
  "imageio-ffmpeg>=0.6",
  "requests>=2.33.1",
]

[project.optional-dependencies]
voice = ["kokoro-onnx==0.6.1", "soundfile>=0.13.1"]
dev = ["build>=1.2", "pip-audit>=2.9"]

[project.scripts]
sceneweaver-mcp = "sceneweaver_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/majhailsid/sceneweaver-mcp"
Issues = "https://github.com/majhailsid/sceneweaver-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
sceneweaver_mcp = ["resources/**/*", "integrations/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

